<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HOMELAND - 결제 완료!</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: #e4e4e4;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .container {
      text-align: center;
      padding: 40px;
      max-width: 500px;
    }
    
    .success-icon {
      font-size: 5rem;
      margin-bottom: 20px;
      animation: bounce 1s ease infinite;
    }
    
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    
    h1 {
      font-size: 2rem;
      color: #64ffda;
      margin-bottom: 15px;
    }
    
    p {
      color: #a8b2d1;
      font-size: 1.1rem;
      margin-bottom: 10px;
    }
    
    .highlight {
      color: #ffbd69;
      font-weight: bold;
    }
    
    .info-box {
      background: rgba(100, 255, 218, 0.1);
      border: 1px solid #64ffda;
      border-radius: 12px;
      padding: 20px;
      margin: 30px 0;
    }
    
    .info-box p {
      font-size: 0.95rem;
      margin: 8px 0;
    }
    
    .btn {
      display: inline-block;
      background: linear-gradient(90deg, #5865F2, #7289da);
      color: white;
      padding: 15px 40px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
      font-size: 1.1rem;
      margin-top: 20px;
      transition: all 0.3s ease;
    }
    
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(88, 101, 242, 0.4);
    }
    
    .links {
      margin-top: 30px;
    }
    
    .links a {
      color: #64ffda;
      text-decoration: none;
      margin: 0 15px;
    }
    
    .links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="success-icon">🎉</div>
    <h1>결제가 완료되었습니다!</h1>
    <p>구매해 주셔서 감사합니다!</p>
    
    <div class="info-box">
      <p>💎 <span class="highlight">아이템이 자동으로 지급됩니다</span></p>
      <p>📱 Discord에서 DM으로 확인하세요</p>
      <p>⏱️ 보통 1분 이내 지급 완료</p>
    </div>
    
    <a href="https://discord.gg/7Fvx7jN4Ke" class="btn">🎮 Discord로 돌아가기</a>
    
    <div class="links">
      <a href="shop.html">🛒 상점으로</a>
      <a href="play-guide.html">📖 플레이 가이드</a>
    </div>
  </div>
</body>
</html>
