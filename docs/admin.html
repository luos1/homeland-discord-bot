<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HOMELAND - 운영 대시보드</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      background: #0f0f1a;
      color: #e4e4e4;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 240px;
      height: 100vh;
      background: #1a1a2e;
      border-right: 1px solid #2a2a4a;
      padding: 20px 0;
    }

    .logo {
      text-align: center;
      padding: 20px;
      border-bottom: 1px solid #2a2a4a;
      margin-bottom: 20px;
    }

    .logo h1 {
      font-size: 1.5rem;
      background: linear-gradient(90deg, #e94560, #ffbd69);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo span { color: #8892b0; font-size: 0.85rem; }

    .nav-item {
      display: flex;
      align-items: center;
      padding: 12px 25px;
      color: #8892b0;
      text-decoration: none;
      transition: all 0.2s;
      cursor: pointer;
    }

    .nav-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
    .nav-item.active { background: rgba(233, 69, 96, 0.2); color: #e94560; border-right: 3px solid #e94560; }
    .nav-item .icon { margin-right: 12px; font-size: 1.2rem; }

    /* Main Content */
    .main {
      margin-left: 240px;
      padding: 30px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .header h2 { font-size: 1.8rem; color: #fff; }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(100, 255, 218, 0.1);
      border-radius: 20px;
      color: #64ffda;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #64ffda;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* Stats Cards */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: #1a1a2e;
      border-radius: 12px;
      padding: 25px;
      border: 1px solid #2a2a4a;
    }

    .stat-card .label { color: #8892b0; font-size: 0.9rem; margin-bottom: 8px; }
    .stat-card .value { font-size: 2rem; font-weight: bold; color: #fff; }
    .stat-card .change { font-size: 0.85rem; margin-top: 5px; }
    .stat-card .change.up { color: #64ffda; }
    .stat-card .change.down { color: #e94560; }

    /* Panels */
    .panel {
      background: #1a1a2e;
      border-radius: 12px;
      padding: 25px;
      border: 1px solid #2a2a4a;
      margin-bottom: 20px;
    }

    .panel h3 {
      color: #fff;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Forms */
    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      color: #8892b0;
      margin-bottom: 5px;
      font-size: 0.9rem;
    }

    .form-input {
      width: 100%;
      padding: 12px 15px;
      background: #0f0f1a;
      border: 1px solid #2a2a4a;
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
    }

    .form-input:focus {
      outline: none;
      border-color: #e94560;
    }

    .form-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(90deg, #e94560, #ff6b6b);
      color: #fff;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(233, 69, 96, 0.4);
    }

    .btn-secondary {
      background: #2a2a4a;
      color: #fff;
    }

    .btn-success {
      background: linear-gradient(90deg, #64ffda, #4ecdc4);
      color: #0f0f1a;
    }

    /* Table */
    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 12px 15px;
      text-align: left;
      border-bottom: 1px solid #2a2a4a;
    }

    th {
      color: #8892b0;
      font-weight: 500;
      font-size: 0.9rem;
    }

    td { color: #e4e4e4; }

    tr:hover { background: rgba(255,255,255,0.02); }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab {
      padding: 10px 20px;
      background: transparent;
      border: 1px solid #2a2a4a;
      border-radius: 8px;
      color: #8892b0;
      cursor: pointer;
    }

    .tab.active {
      background: #e94560;
      border-color: #e94560;
      color: #fff;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      padding: 15px 25px;
      border-radius: 8px;
      color: #fff;
      display: none;
      z-index: 1000;
    }

    .toast.success { background: #64ffda; color: #0f0f1a; }
    .toast.error { background: #e94560; }

    /* Section visibility */
    .section { display: none; }
    .section.active { display: block; }

    /* Quick Actions */
    .quick-actions {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }

    .quick-action {
      background: #0f0f1a;
      border: 1px solid #2a2a4a;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .quick-action:hover {
      border-color: #e94560;
      transform: translateY(-3px);
    }

    .quick-action .icon { font-size: 2rem; margin-bottom: 10px; }
    .quick-action .label { color: #8892b0; font-size: 0.9rem; }

    @media (max-width: 1200px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .form-row { grid-template-columns: 1fr; }
      .quick-actions { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main { margin-left: 0; }
    }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="logo">
      <h1>⚔️ HOMELAND</h1>
      <span>Admin Dashboard</span>
    </div>
    <nav>
      <a class="nav-item active" data-section="dashboard">
        <span class="icon">📊</span> 대시보드
      </a>
      <a class="nav-item" data-section="users">
        <span class="icon">👥</span> 유저 관리
      </a>
      <a class="nav-item" data-section="give">
        <span class="icon">🎁</span> 아이템 지급
      </a>
      <a class="nav-item" data-section="premium">
        <span class="icon">⭐</span> 프리미엄
      </a>
      <a class="nav-item" data-section="announce">
        <span class="icon">📢</span> 공지
      </a>
      <a class="nav-item" data-section="logs">
        <span class="icon">📋</span> 로그
      </a>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="main">
    <!-- Dashboard Section -->
    <div class="section active" id="dashboard">
      <div class="header">
        <h2>📊 대시보드</h2>
        <div class="status-badge">
          <div class="status-dot"></div>
          <span>서버 온라인</span>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="label">총 유저</div>
          <div class="value" id="totalUsers">-</div>
          <div class="change up">↑ 오늘 +0</div>
        </div>
        <div class="stat-card">
          <div class="label">활성 유저 (24h)</div>
          <div class="value" id="activeUsers">-</div>
        </div>
        <div class="stat-card">
          <div class="label">총 골드</div>
          <div class="value" id="totalGold">-</div>
        </div>
        <div class="stat-card">
          <div class="label">프리미엄 유저</div>
          <div class="value" id="premiumUsers">-</div>
        </div>
      </div>

      <div class="panel">
        <h3>⚡ 빠른 작업</h3>
        <div class="quick-actions">
          <div class="quick-action" onclick="showSection('give')">
            <div class="icon">💎</div>
            <div class="label">젬 지급</div>
          </div>
          <div class="quick-action" onclick="showSection('premium')">
            <div class="icon">⭐</div>
            <div class="label">프리미엄 지급</div>
          </div>
          <div class="quick-action" onclick="showSection('announce')">
            <div class="icon">📢</div>
            <div class="label">공지 발송</div>
          </div>
          <div class="quick-action" onclick="showSection('users')">
            <div class="icon">🔍</div>
            <div class="label">유저 검색</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Users Section -->
    <div class="section" id="users">
      <div class="header">
        <h2>👥 유저 관리</h2>
      </div>

      <div class="panel">
        <h3>🔍 유저 검색</h3>
        <div class="form-row">
          <div class="form-group">
            <label>Discord ID</label>
            <input type="text" class="form-input" id="searchDiscordId" placeholder="123456789012345678">
          </div>
          <div class="form-group">
            <label>캐릭터 이름</label>
            <input type="text" class="form-input" id="searchName" placeholder="캐릭터명">
          </div>
          <div class="form-group">
            <label>&nbsp;</label>
            <button class="btn btn-primary" onclick="searchUser()">검색</button>
          </div>
        </div>
      </div>

      <div class="panel" id="userResult" style="display: none;">
        <h3>📋 검색 결과</h3>
        <div id="userInfo"></div>
      </div>
    </div>

    <!-- Give Section -->
    <div class="section" id="give">
      <div class="header">
        <h2>🎁 아이템 지급</h2>
      </div>

      <div class="panel">
        <h3>💰 골드/젬 지급</h3>
        <div class="form-row">
          <div class="form-group">
            <label>Discord ID *</label>
            <input type="text" class="form-input" id="giveDiscordId" placeholder="123456789012345678">
          </div>
          <div class="form-group">
            <label>지급 타입</label>
            <select class="form-input" id="giveType">
              <option value="gold">💰 골드</option>
              <option value="gems">💎 젬</option>
            </select>
          </div>
          <div class="form-group">
            <label>수량</label>
            <input type="number" class="form-input" id="giveAmount" placeholder="1000">
          </div>
        </div>
        <div class="form-group">
          <label>지급 사유</label>
          <input type="text" class="form-input" id="giveReason" placeholder="베타 보상">
        </div>
        <button class="btn btn-success" onclick="giveItems()">지급하기</button>
      </div>
    </div>

    <!-- Premium Section -->
    <div class="section" id="premium">
      <div class="header">
        <h2>⭐ 프리미엄 관리</h2>
      </div>

      <div class="panel">
        <h3>⭐ 프리미엄 지급</h3>
        <div class="form-row">
          <div class="form-group">
            <label>Discord ID *</label>
            <input type="text" class="form-input" id="premiumDiscordId" placeholder="123456789012345678">
          </div>
          <div class="form-group">
            <label>기간 (일)</label>
            <select class="form-input" id="premiumDays">
              <option value="7">7일</option>
              <option value="30" selected>30일</option>
              <option value="90">90일</option>
              <option value="365">365일</option>
            </select>
          </div>
          <div class="form-group">
            <label>&nbsp;</label>
            <button class="btn btn-success" onclick="givePremium()">지급하기</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Announce Section -->
    <div class="section" id="announce">
      <div class="header">
        <h2>📢 공지 발송</h2>
      </div>

      <div class="panel">
        <h3>📢 새 공지</h3>
        <div class="form-group">
          <label>제목</label>
          <input type="text" class="form-input" id="announceTitle" placeholder="공지 제목">
        </div>
        <div class="form-group">
          <label>내용</label>
          <textarea class="form-input" id="announceContent" rows="5" placeholder="공지 내용..."></textarea>
        </div>
        <div class="form-group">
          <label>채널</label>
          <select class="form-input" id="announceChannel">
            <option value="1475831266648653946">📢announcements</option>
            <option value="1475831267927920816">🔔updates</option>
          </select>
        </div>
        <button class="btn btn-primary" onclick="sendAnnounce()">발송하기</button>
      </div>
    </div>

    <!-- Logs Section -->
    <div class="section" id="logs">
      <div class="header">
        <h2>📋 운영 로그</h2>
      </div>

      <div class="panel">
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>시간</th>
                <th>작업</th>
                <th>대상</th>
                <th>내용</th>
              </tr>
            </thead>
            <tbody id="logsTable">
              <tr>
                <td colspan="4" style="text-align: center; color: #8892b0;">로그가 없습니다</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    const API_URL = 'https://homeland-discord-bot-production.up.railway.app';
    const ADMIN_KEY = localStorage.getItem('adminKey') || prompt('관리자 키를 입력하세요:');
    if (ADMIN_KEY) localStorage.setItem('adminKey', ADMIN_KEY);

    // Navigation
    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', () => {
        const section = item.dataset.section;
        showSection(section);
      });
    });

    function showSection(sectionId) {
      document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      
      document.querySelector(`[data-section="${sectionId}"]`)?.classList.add('active');
      document.getElementById(sectionId)?.classList.add('active');
    }

    // Toast
    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = `toast ${type}`;
      toast.style.display = 'block';
      setTimeout(() => toast.style.display = 'none', 3000);
    }

    // API Calls
    async function apiCall(endpoint, method = 'GET', body = null) {
      try {
        const options = {
          method,
          headers: {
            'Content-Type': 'application/json',
            'X-Admin-Key': ADMIN_KEY
          }
        };
        if (body) options.body = JSON.stringify(body);
        
        const res = await fetch(`${API_URL}${endpoint}`, options);
        return await res.json();
      } catch (error) {
        console.error('API Error:', error);
        showToast('API 연결 실패', 'error');
        return null;
      }
    }

    // Load Stats
    async function loadStats() {
      const stats = await apiCall('/api/admin/stats');
      if (stats) {
        document.getElementById('totalUsers').textContent = stats.totalUsers || 0;
        document.getElementById('activeUsers').textContent = stats.activeUsers || 0;
        document.getElementById('totalGold').textContent = formatNumber(stats.totalGold || 0);
        document.getElementById('premiumUsers').textContent = stats.premiumUsers || 0;
      }
    }

    // Search User
    async function searchUser() {
      const discordId = document.getElementById('searchDiscordId').value;
      const name = document.getElementById('searchName').value;
      
      if (!discordId && !name) {
        showToast('검색어를 입력하세요', 'error');
        return;
      }

      const result = await apiCall(`/api/admin/user?discordId=${discordId}&name=${name}`);
      const panel = document.getElementById('userResult');
      const info = document.getElementById('userInfo');
      
      if (result && result.user) {
        const u = result.user;
        info.innerHTML = `
          <p><strong>캐릭터:</strong> ${u.name} (Lv.${u.level})</p>
          <p><strong>Discord ID:</strong> ${u.odUserId}</p>
          <p><strong>직업:</strong> ${u.class} → ${u.advancedClass || '미전직'}</p>
          <p><strong>골드:</strong> ${formatNumber(u.gold)}G</p>
          <p><strong>젬:</strong> ${formatNumber(u.gems || 0)}</p>
          <p><strong>생성일:</strong> ${new Date(u.createdAt).toLocaleDateString()}</p>
        `;
        panel.style.display = 'block';
      } else {
        info.innerHTML = '<p style="color: #e94560;">유저를 찾을 수 없습니다</p>';
        panel.style.display = 'block';
      }
    }

    // Give Items
    async function giveItems() {
      const discordId = document.getElementById('giveDiscordId').value;
      const type = document.getElementById('giveType').value;
      const amount = parseInt(document.getElementById('giveAmount').value);
      const reason = document.getElementById('giveReason').value;

      if (!discordId || !amount) {
        showToast('필수 항목을 입력하세요', 'error');
        return;
      }

      const result = await apiCall('/api/admin/give', 'POST', {
        discordId, type, amount, reason
      });

      if (result && result.ok) {
        showToast(`${type === 'gold' ? '골드' : '젬'} ${amount} 지급 완료!`);
        addLog('지급', discordId, `${type} ${amount} (${reason})`);
      } else {
        showToast(result?.error || '지급 실패', 'error');
      }
    }

    // Give Premium
    async function givePremium() {
      const discordId = document.getElementById('premiumDiscordId').value;
      const days = parseInt(document.getElementById('premiumDays').value);

      if (!discordId) {
        showToast('Discord ID를 입력하세요', 'error');
        return;
      }

      const result = await apiCall('/api/admin/premium', 'POST', {
        discordId, days
      });

      if (result && result.ok) {
        showToast(`프리미엄 ${days}일 지급 완료!`);
        addLog('프리미엄', discordId, `${days}일`);
      } else {
        showToast(result?.error || '지급 실패', 'error');
      }
    }

    // Send Announce
    async function sendAnnounce() {
      const title = document.getElementById('announceTitle').value;
      const content = document.getElementById('announceContent').value;
      const channel = document.getElementById('announceChannel').value;

      if (!title || !content) {
        showToast('제목과 내용을 입력하세요', 'error');
        return;
      }

      const result = await apiCall('/api/admin/announce', 'POST', {
        title, content, channelId: channel
      });

      if (result && result.ok) {
        showToast('공지 발송 완료!');
        addLog('공지', channel, title);
        document.getElementById('announceTitle').value = '';
        document.getElementById('announceContent').value = '';
      } else {
        showToast(result?.error || '발송 실패', 'error');
      }
    }

    // Local Logs
    const logs = JSON.parse(localStorage.getItem('adminLogs') || '[]');

    function addLog(action, target, content) {
      logs.unshift({
        time: new Date().toLocaleString(),
        action, target, content
      });
      if (logs.length > 50) logs.pop();
      localStorage.setItem('adminLogs', JSON.stringify(logs));
      renderLogs();
    }

    function renderLogs() {
      const tbody = document.getElementById('logsTable');
      if (logs.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #8892b0;">로그가 없습니다</td></tr>';
        return;
      }
      tbody.innerHTML = logs.map(log => `
        <tr>
          <td>${log.time}</td>
          <td>${log.action}</td>
          <td>${log.target}</td>
          <td>${log.content}</td>
        </tr>
      `).join('');
    }

    function formatNumber(n) {
      return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    }

    // Init
    loadStats();
    renderLogs();
  </script>
</body>
</html>
